name: Forecast health
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: production
        required: true
      model:
        description: Registered forecast model
        type: string
        default: all
        required: true
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select forecast models
        id: models
        env:
          MODEL_SELECTION: ${{ inputs.model || 'all' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: node --import tsx scripts/workflow-models.ts
  check:
    name: Check ${{ matrix.model }}
    needs: select
    if: needs.select.outputs.models != '[]'
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.select.outputs.models) }}
    concurrency:
      group: health-${{ inputs.environment || 'production' }}-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check publication, horizon and serving
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MODEL: ${{ matrix.model }}
        run: pnpm health
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: health-${{ inputs.environment || 'production' }}-${{ matrix.model }}-${{ github.run_id }}
          overwrite: true
          path: output/health/
          retention-days: 14
