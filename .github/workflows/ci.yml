name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # Fork and Dependabot pull requests run untrusted code; keep them off the AWS runners.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-24.04'
      || format('runs-on={0}/runner=4cpu-linux-x64/spot={1}/image=ubuntu24-full-x64/extras=s3-cache', github.run_id, github.event_name == 'pull_request') }}
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1
        if: runner.environment != 'github-hosted'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm tools:pmtiles
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.8.17'
          prune-cache: false
          cache-dependency-glob: |
            scripts/masks/*.py
            apps/batch/src/terrain/*.py
            .github/workflows/ci.yml
      - name: Verify foundation
        run: pnpm verify
      - name: Ensure browser for wind smoke
        run: command -v google-chrome >/dev/null || pnpm exec playwright install --with-deps chromium
      - name: Smoke numeric wind preview and Python checks
        run: |
          pnpm smoke:wind --fixture &
          SMOKE_PID=$!
          uv run --python 3.12 --with shapely==2.1.2 --with pyproj==3.7.2 --with pyshp==2.3.1 python scripts/masks/test_fine_masks.py
          uv run --python 3.12 --with rasterio==1.4.3 --with numpy==2.2.6 python apps/batch/src/terrain/test_repack.py
          wait $SMOKE_PID
