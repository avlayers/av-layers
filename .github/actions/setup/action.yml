name: Set up workspace
description: Install the package-defined Node and pnpm versions and locked dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: pnpm
    - uses: actions/cache@v4
      with:
        path: .tools
        key: pmtiles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/batch/pmtiles.json') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
